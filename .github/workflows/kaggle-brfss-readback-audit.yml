name: Audit BRFSS Canonical Outputs

on:
  push:
    branches:
      - implement/BRFSS_survey
    paths:
      - .github/workflows/kaggle-brfss-readback-audit.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: brfss-canonical-readback-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
      KERNEL_REF: manhthien2005/brfss-2025-diabetes-classification

    steps:
      - uses: actions/checkout@v4
        with:
          ref: implement/BRFSS_survey
          fetch-depth: 1
          lfs: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Kaggle CLI
        run: python -m pip install --upgrade kaggle

      - name: Download completed canonical outputs
        shell: bash
        run: |
          set -euo pipefail
          unset KAGGLE_API_TOKEN || true
          STATUS="$(kaggle kernels status "$KERNEL_REF")"
          echo "$STATUS"
          echo "$STATUS" | grep -Eqi 'complete|success'

          rm -rf /tmp/brfss-output
          mkdir -p /tmp/brfss-output
          kaggle kernels output "$KERNEL_REF" -p /tmp/brfss-output -o

      - name: Audit output contract and frozen metrics
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv
          import json
          import math
          from pathlib import Path

          root = Path("/tmp/brfss-output")
          comparison = root / "model_comparison"

          required_root = [
              "dataset_overview.json",
              "preprocessing_summary.json",
              "analytical_missingness.csv",
              "split_summary.csv",
          ]
          for name in required_root:
              assert (root / name).is_file(), name

          model_dirs = [
              "model_01_logistic_regression",
              "model_02_decision_tree",
              "model_03_random_forest",
              "model_04_gradient_boosting",
              "model_05_xgboost",
              "model_06_linear_svm",
              "model_07_gaussian_naive_bayes",
          ]
          for d in model_dirs:
              p = root / d
              for name in ["cv_folds.csv","cv_summary.csv","test_point_metrics.json","test_summary.csv"]:
                  assert (p / name).is_file(), f"{d}/{name}"

          required_comparison = [
              "model_comparison.csv",
              "paired_test_predictions.csv.gz",
              "paired_bootstrap_model_metrics.csv",
              "paired_bootstrap_differences.csv",
              "mcnemar_pairwise_holm.csv",
              "roc_comparison.png",
              "pr_comparison.png",
              "metric_matrix.png",
              "precision_recall_tradeoff.png",
              "calibration_comparison.png",
              "aggregated_feature_diagnostics.csv",
              "feature_diagnostic_matrix.png",
              "comparison_manifest.json",
          ]
          for name in required_comparison:
              assert (comparison / name).is_file(), name

          with (comparison / "model_comparison.csv").open(newline="", encoding="utf-8") as f:
              rows = list(csv.DictReader(f))
          assert len(rows) == 7, len(rows)
          by_id = {r["model_id"]: r for r in rows}

          frozen = {
              "logistic_regression": {"test_accuracy":0.8558270566941087,"test_f1":0.2831845562087234,"test_roc_auc":0.8261678122652486,"test_pr_auc":0.44663290841217973},
              "decision_tree": {"test_accuracy":0.78615636130087,"test_f1":0.32351311414850387,"test_roc_auc":0.6020699144719784,"test_pr_auc":0.20533779176339034},
              "random_forest": {"test_accuracy":0.8510392946809132,"test_f1":0.2773174704341052,"test_roc_auc":0.8044953607113304,"test_pr_auc":0.40246501462675927},
              "gradient_boosting": {"test_accuracy":0.8563525427687277,"test_f1":0.26630880489077763,"test_roc_auc":0.8260155801805384,"test_pr_auc":0.4483169949856431},
              "xgboost": {"test_accuracy":0.8548198750510889,"test_f1":0.2904836638607505,"test_roc_auc":0.8262898793557036,"test_pr_auc":0.44171377834099224},
              "linear_svm": {"test_accuracy":0.8559876218835757,"test_f1":0.20242522231204527,"test_roc_auc":0.8261580968770885,"test_pr_auc":0.44788405460506064},
              "gaussian_naive_bayes": {"test_accuracy":0.7272873241081333,"test_f1":0.4400083925306477,"test_roc_auc":0.7885646728624294,"test_pr_auc":0.36412201184388493},
          }
          for model, expected in frozen.items():
              assert model in by_id, model
              for metric, value in expected.items():
                  actual = float(by_id[model][metric])
                  assert abs(actual - value) <= 1e-6, (model, metric, actual, value)

          with (comparison / "paired_bootstrap_differences.csv").open(newline="", encoding="utf-8") as f:
              paired = list(csv.DictReader(f))
          with (comparison / "mcnemar_pairwise_holm.csv").open(newline="", encoding="utf-8") as f:
              mcnemar = list(csv.DictReader(f))
          with (comparison / "comparison_manifest.json").open(encoding="utf-8") as f:
              manifest = json.load(f)

          assert manifest["single_notebook_pipeline"] is True
          assert manifest["test_n"] == 68508
          assert len(manifest["primary_models"]) == 7
          assert len(mcnemar) == 21

          baseline_pairs = [
              r for r in paired
              if r["model_a"] == "logistic_regression"
              and r["metric"] in {"roc_auc","pr_auc","balanced_accuracy","f1"}
          ]
          assert len(baseline_pairs) == 24, len(baseline_pairs)

          print("=== AUDIT STATUS ===")
          print("OUTPUT_CONTRACT=PASS")
          print("FROZEN_METRIC_RECONCILIATION=PASS")
          print("PAIRED_BOOTSTRAP_ROWS=", len(paired))
          print("MCNEMAR_PAIR_COUNT=", len(mcnemar))
          print("TEST_N=", manifest["test_n"])

          print("\n=== PRIMARY LR-vs-CHALLENGER PAIRED DIFFERENCES ===")
          for r in baseline_pairs:
              print(
                  f'{r["model_a"]} vs {r["model_b"]} | {r["metric"]} | '
                  f'delta={float(r["point_difference_a_minus_b"]):+.9f} | '
                  f'CI=[{float(r["ci95_lower"]):+.9f}, {float(r["ci95_upper"]):+.9f}] | '
                  f'excludes0={r["ci_excludes_zero_unadjusted"]}'
              )

          print("\n=== HOLM-SIGNIFICANT MCNEMAR PAIRS ===")
          significant = [r for r in mcnemar if r["significant_holm_0_05"].lower() == "true"]
          print("COUNT=", len(significant))
          for r in significant:
              print(
                  f'{r["model_a"]} vs {r["model_b"]} | '
                  f'acc_delta={float(r["accuracy_difference_a_minus_b"]):+.9f} | '
                  f'p_holm={float(r["p_value_holm"]):.6g}'
              )

          print("\n=== TEST MODEL TABLE ===")
          for r in rows:
              print(
                  f'{r["model"]}: '
                  f'BalAcc={float(r["test_balanced_accuracy"]):.6f}, '
                  f'F1={float(r["test_f1"]):.6f}, '
                  f'ROC={float(r["test_roc_auc"]):.6f}, '
                  f'PR={float(r["test_pr_auc"]):.6f}'
              )
          PY

      - name: Preserve audited canonical outputs
        uses: actions/upload-artifact@v4
        with:
          name: brfss-2025-canonical-audited-output
          path: /tmp/brfss-output/
          if-no-files-found: error
