name: Add BRFSS 2025 raw ZIP

on:
  push:
    branches:
      - implement/BRFSS_survey
    paths:
      - .github/workflows/brfss-add-raw-zip.yml

permissions:
  contents: write

jobs:
  add-raw-zip:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: implement/BRFSS_survey
          fetch-depth: 0
          lfs: true

      - name: Download and verify official CDC archive
        shell: bash
        env:
          CDC_URL: https://www.cdc.gov/brfss/annual_data/2025/files/LLCP2025XPT.zip
          ZIP_PATH: 02_Implementation/BRFSS_Survey/data/raw/LLCP2025XPT.zip
          EXPECTED_SHA256: d26a8b391aa2966b58dc2a3ffddf8da050e9f38eb143d0f5ca7b3d21ece08f98
          EXPECTED_BYTES: "64642184"
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$ZIP_PATH")"
          curl --fail --location --retry 5 --retry-delay 3 "$CDC_URL" --output "$ZIP_PATH"
          test "$(sha256sum "$ZIP_PATH" | awk '{print $1}')" = "$EXPECTED_SHA256"
          test "$(stat -c '%s' "$ZIP_PATH")" = "$EXPECTED_BYTES"

      - name: Force-add ignored ZIP through Git LFS and remove bootstrap workflow
        shell: bash
        env:
          ZIP_PATH: 02_Implementation/BRFSS_Survey/data/raw/LLCP2025XPT.zip
        run: |
          set -euo pipefail
          git lfs install
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/brfss-add-raw-zip.yml
          git add -f "$ZIP_PATH"
          git status --short
          git commit -m "data(brfss): add original CDC BRFSS 2025 ZIP"
          git push origin HEAD:implement/BRFSS_survey
