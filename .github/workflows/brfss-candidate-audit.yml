name: Audit BRFSS 2025 Candidate Variables

on:
  push:
    branches:
      - implement/BRFSS_survey
    paths:
      - .github/workflows/brfss-candidate-audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ZIP_PATH: 02_Implementation/BRFSS_Survey/data/raw/LLCP2025XPT.zip

    steps:
      - uses: actions/checkout@v4
        with:
          ref: implement/BRFSS_survey
          fetch-depth: 1
          lfs: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Pull verified CDC ZIP only
        shell: bash
        run: |
          set -euo pipefail
          git lfs install
          git lfs pull --include="$ZIP_PATH" --exclude=""
          test "$(stat -c '%s' "$ZIP_PATH")" = "64642184"
          test "$(sha256sum "$ZIP_PATH" | awk '{print $1}')" = "d26a8b391aa2966b58dc2a3ffddf8da050e9f38eb143d0f5ca7b3d21ece08f98"

      - name: Audit candidate variables
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd

          from zipfile import ZipFile

          zip_path = Path("02_Implementation/BRFSS_Survey/data/raw/LLCP2025XPT.zip")
          xpt_path = Path("/tmp/LLCP2025.XPT")
          with ZipFile(zip_path) as zf:
              files = [i for i in zf.infolist() if not i.is_dir()]
              if len(files) != 1:
                  raise RuntimeError(f"Expected one XPT payload, found {len(files)}")
              member = files[0]
              if member.file_size != 799_971_280:
                  raise RuntimeError(f"Unexpected XPT size: {member.file_size}")
              with zf.open(member) as src, xpt_path.open("wb") as dst:
                  for chunk in iter(lambda: src.read(8 * 1024 * 1024), b""):
                      dst.write(chunk)

          df = pd.read_sas(xpt_path, format="xport", encoding="utf-8")

          candidates = [
              "DIABETE4",
              "_AGEG5YR", "_SEX", "_RACEGR3", "_EDUCAG", "_INCOMG1", "EMPLOY1", "MARITAL",
              "_BMI5", "_BMI5CAT",
              "GENHLTH", "PHYSHLTH", "MENTHLTH", "_RFHLTH",
              "_HLTHPL2", "PERSDOC3", "MEDCOST1", "CHECKUP1",
              "_TOTINDA", "_RFSMOK3", "DRNKANY6", "_RFBING6", "SLEPTIM1",
              "_RFHYPE6", "_RFCHOL3",
              "_MICHD", "CVDSTRK3", "CHCKDNY2", "DIFFWALK",
              "ASTHMA3", "ADDEPEV3", "HAVARTH4"
          ]
          leakage = [
              "DIABAGE4", "INSULIN1", "CHKHEMO3", "EYEEXAM1", "DIABEYE1", "DIABEDU1"
          ]

          rows = []
          for col in candidates + leakage:
              exists = col in df.columns
              if not exists:
                  rows.append({
                      "variable": col, "exists": False, "dtype": None,
                      "missing_count": None, "missing_pct": None,
                      "n_unique_nonnull": None
                  })
                  continue
              s = df[col]
              rows.append({
                  "variable": col,
                  "exists": True,
                  "dtype": str(s.dtype),
                  "missing_count": int(s.isna().sum()),
                  "missing_pct": round(float(s.isna().mean() * 100), 4),
                  "n_unique_nonnull": int(s.nunique(dropna=True)),
              })

          out = pd.DataFrame(rows)
          out.to_csv("/tmp/candidate_variable_audit.csv", index=False)
          print("=== CANDIDATE VARIABLE AUDIT ===")
          print(out.to_csv(index=False))

          print("=== TOP VALUE COUNTS ===")
          for col in candidates + leakage:
              if col not in df.columns:
                  print(f"## {col}: NOT PRESENT")
                  continue
              print(f"## {col}")
              print(df[col].value_counts(dropna=False).head(20).to_string())

          print("=== DATASET SHAPE ===")
          print(df.shape)
          PY

      - name: Upload audit
        uses: actions/upload-artifact@v4
        with:
          name: brfss-candidate-variable-audit
          path: /tmp/candidate_variable_audit.csv
