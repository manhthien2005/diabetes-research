name: Kaggle Dataset Canary

on:
  push:
    branches:
      - implement/BRFSS_survey
    paths:
      - .github/workflows/kaggle-dataset-canary.yml

permissions:
  contents: read

jobs:
  canary:
    runs-on: ubuntu-latest
    env:
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
      CANARY_REF: manhthien2005/brfss-api-canary

    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Kaggle CLI
        run: python -m pip install --upgrade kaggle

      - name: Create tiny private dataset and read it back
        shell: bash
        run: |
          set -euo pipefail
          unset KAGGLE_API_TOKEN || true

          rm -rf /tmp/kaggle-canary
          mkdir -p /tmp/kaggle-canary
          printf 'BRFSS Kaggle API canary\n' > /tmp/kaggle-canary/canary.txt
          cat > /tmp/kaggle-canary/dataset-metadata.json <<'JSON'
          {
            "title": "BRFSS API Canary",
            "id": "manhthien2005/brfss-api-canary",
            "licenses": [{"name": "other"}]
          }
          JSON

          echo "=== CREATE ==="
          kaggle datasets create -p /tmp/kaggle-canary

          echo "=== POLL READ-BACK ==="
          ok=0
          for i in $(seq 1 30); do
            if kaggle datasets files "$CANARY_REF" -v > /tmp/canary-files.txt 2>/tmp/canary-files.err; then
              cat /tmp/canary-files.txt
              if grep -q 'canary.txt' /tmp/canary-files.txt; then
                ok=1
                break
              fi
            else
              cat /tmp/canary-files.err || true
            fi
            sleep 5
          done

          if [ "$ok" -ne 1 ]; then
            echo "CANARY_READBACK_FAILED"
            exit 1
          fi

          echo "CANARY_READBACK_OK"
