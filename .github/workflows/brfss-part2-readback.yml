name: Read BRFSS Part II Outputs

on:
  push:
    branches:
      - implement/BRFSS_survey
    paths:
      - .github/workflows/brfss-part2-readback.yml

permissions:
  contents: read

jobs:
  readback:
    runs-on: ubuntu-latest
    env:
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
      KERNEL_REF: manhthien2005/brfss-2025-data-exploration
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade kaggle
      - name: Download Part II outputs
        shell: bash
        run: |
          set -euo pipefail
          unset KAGGLE_API_TOKEN || true
          rm -rf /tmp/part2 && mkdir -p /tmp/part2
          kaggle kernels output "$KERNEL_REF" -p /tmp/part2 -o
          echo "=== PREPROCESSING_SUMMARY ==="
          cat /tmp/part2/preprocessing_summary.json
          echo "=== SPLIT_SUMMARY ==="
          cat /tmp/part2/split_summary.csv
          echo "=== CV_FOLD_SUMMARY ==="
          cat /tmp/part2/cv_fold_summary.csv
          echo "=== ANALYTICAL_MISSINGNESS ==="
          cat /tmp/part2/analytical_missingness.csv
