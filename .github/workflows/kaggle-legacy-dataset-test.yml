name: Test Kaggle Legacy Dataset Access

on:
  push:
    branches:
      - implement/BRFSS_survey
    paths:
      - .github/workflows/kaggle-legacy-dataset-test.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
      DATASET_REF: manhthien2005/brfss-2025-diabetes-survey

    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CLI
        run: python -m pip install --upgrade kaggle

      - name: Test legacy dataset APIs
        shell: bash
        run: |
          set +e
          unset KAGGLE_API_TOKEN || true

          echo "=== LEGACY AUTH PRESENCE ==="
          test -n "${KAGGLE_USERNAME:-}" && echo "username_present=yes" || echo "username_present=no"
          test -n "${KAGGLE_KEY:-}" && echo "key_present=yes" || echo "key_present=no"

          echo "=== DATASETS LIST MINE ==="
          kaggle datasets list -m -v
          echo "exit=$?"

          echo "=== DATASET FILES TARGET ==="
          kaggle datasets files "$DATASET_REF" -v
          echo "exit=$?"

          echo "=== DATASET METADATA TARGET ==="
          rm -rf /tmp/kmeta && mkdir -p /tmp/kmeta
          kaggle datasets metadata "$DATASET_REF" -p /tmp/kmeta
          echo "exit=$?"
