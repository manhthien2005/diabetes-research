name: Cleanup Kaggle BRFSS Temp Resources

on:
  push:
    branches:
      - implement/BRFSS_survey
    paths:
      - .github/workflows/kaggle-brfss-cleanup-temp.yml

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}

    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Kaggle CLI
        run: python -m pip install --upgrade kaggle

      - name: Delete temporary Kaggle datasets
        shell: bash
        run: |
          set -euo pipefail
          unset KAGGLE_API_TOKEN || true

          echo "Deleting canary dataset if present..."
          kaggle datasets delete manhthien2005/brfss-api-canary -y || true

          echo "Deleting failed zero-byte dataset if present..."
          kaggle datasets delete manhthien2005/brfss-2025-diabetes-survey -y || true

          echo "Final datasets owned by account:"
          kaggle datasets list -m -v
