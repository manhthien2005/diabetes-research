name: Bootstrap BRFSS on Kaggle

on:
  push:
    branches:
      - implement/BRFSS_survey
    paths:
      - .github/workflows/kaggle-brfss-bootstrap.yml
      - 02_Implementation/BRFSS_Survey/kaggle/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-and-run-eda:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
      DATASET_REF: manhthien2005/brfss-2025-diabetes-survey
      KERNEL_REF: manhthien2005/brfss-2025-data-exploration
      ZIP_PATH: 02_Implementation/BRFSS_Survey/data/raw/LLCP2025XPT.zip
      DATASET_METADATA: 02_Implementation/BRFSS_Survey/kaggle/dataset/dataset-metadata.json
      NOTEBOOK_DIR: 02_Implementation/BRFSS_Survey/kaggle/notebook

    steps:
      - name: Checkout branch without downloading all LFS objects
        uses: actions/checkout@v4
        with:
          ref: implement/BRFSS_survey
          fetch-depth: 1
          lfs: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Kaggle CLI
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip kaggle
          kaggle --version

      - name: Validate legacy Kaggle credentials
        shell: bash
        run: |
          set -euo pipefail
          unset KAGGLE_API_TOKEN || true
          test -n "${KAGGLE_USERNAME:-}"
          test -n "${KAGGLE_KEY:-}"
          test "$KAGGLE_USERNAME" = "manhthien2005"
          kaggle kernels list -m --page-size 1 >/dev/null
          echo "Legacy Kaggle authentication succeeded."

      - name: Pull and verify original CDC ZIP
        shell: bash
        run: |
          set -euo pipefail
          git lfs install
          git lfs pull --include="$ZIP_PATH" --exclude=""

          test -s "$ZIP_PATH"
          test "$(stat -c '%s' "$ZIP_PATH")" = "64642184"
          test "$(sha256sum "$ZIP_PATH" | awk '{print $1}')" = "d26a8b391aa2966b58dc2a3ffddf8da050e9f38eb143d0f5ca7b3d21ece08f98"

      - name: Normalize CDC archive member name
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/brfss-normalize /tmp/kaggle-brfss-dataset
          mkdir -p /tmp/brfss-normalize /tmp/kaggle-brfss-dataset

          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          import hashlib

          src_zip = Path("02_Implementation/BRFSS_Survey/data/raw/LLCP2025XPT.zip")
          normalized_xpt = Path("/tmp/brfss-normalize/LLCP2025.XPT")
          normalized_zip = Path("/tmp/kaggle-brfss-dataset/LLCP2025XPT.zip")

          with ZipFile(src_zip) as zf:
              files = [i for i in zf.infolist() if not i.is_dir()]
              if len(files) != 1:
                  raise SystemExit(f"Expected exactly one payload; found {len(files)}")
              member = files[0]
              if member.filename != "LLCP2025.XPT ":
                  raise SystemExit(f"Unexpected CDC member name: {member.filename!r}")
              if member.file_size != 799_971_280:
                  raise SystemExit(f"Unexpected XPT size: {member.file_size}")

              with zf.open(member) as src, normalized_xpt.open("wb") as dst:
                  while True:
                      chunk = src.read(8 * 1024 * 1024)
                      if not chunk:
                          break
                      dst.write(chunk)

          if normalized_xpt.stat().st_size != 799_971_280:
              raise SystemExit("Normalized XPT size mismatch")

          h = hashlib.sha256()
          with normalized_xpt.open("rb") as f:
              for chunk in iter(lambda: f.read(8 * 1024 * 1024), b""):
                  h.update(chunk)
          print("Normalized XPT SHA-256:", h.hexdigest())

          with ZipFile(normalized_zip, "w", compression=ZIP_DEFLATED, compresslevel=6) as zf:
              zf.write(normalized_xpt, arcname="LLCP2025.XPT")

          with ZipFile(normalized_zip) as zf:
              files = [i for i in zf.infolist() if not i.is_dir()]
              if len(files) != 1 or files[0].filename != "LLCP2025.XPT":
                  raise SystemExit("Normalized ZIP verification failed")
              if files[0].file_size != 799_971_280:
                  raise SystemExit("Normalized ZIP payload size mismatch")

          print("Normalized ZIP bytes:", normalized_zip.stat().st_size)
          PY

          cp "$DATASET_METADATA" /tmp/kaggle-brfss-dataset/dataset-metadata.json
          ls -lh /tmp/kaggle-brfss-dataset

      - name: Create and verify private Kaggle dataset
        shell: bash
        run: |
          set -euo pipefail
          unset KAGGLE_API_TOKEN || true

          if kaggle datasets files "$DATASET_REF" -v >/tmp/brfss-files.txt 2>/tmp/brfss-files.err; then
            echo "Target dataset already exists:"
            cat /tmp/brfss-files.txt
          else
            echo "Creating BRFSS dataset from normalized archive."
            cat /tmp/brfss-files.err || true
            kaggle datasets create -p /tmp/kaggle-brfss-dataset
          fi

          READY=0
          for attempt in $(seq 1 60); do
            if kaggle datasets files "$DATASET_REF" -v >/tmp/brfss-files.txt 2>/tmp/brfss-files.err; then
              cat /tmp/brfss-files.txt
              if grep -Eq 'LLCP2025\.XPT|LLCP2025XPT\.zip' /tmp/brfss-files.txt; then
                READY=1
                break
              fi
            else
              echo "Read-back attempt $attempt:"
              cat /tmp/brfss-files.err || true
            fi
            sleep 10
          done

          if [ "$READY" -ne 1 ]; then
            echo "BRFSS dataset did not become readable."
            exit 1
          fi

          echo "Verified BRFSS Kaggle dataset via read-back API."

      - name: Push and run EDA notebook
        shell: bash
        run: |
          set -euo pipefail
          unset KAGGLE_API_TOKEN || true
          kaggle kernels push -p "$NOTEBOOK_DIR" --timeout 7200

      - name: Wait for Kaggle notebook to finish
        shell: bash
        run: |
          set -euo pipefail
          unset KAGGLE_API_TOKEN || true
          COMPLETE=0

          for attempt in $(seq 1 100); do
            STATUS="$(kaggle kernels status "$KERNEL_REF" 2>&1 || true)"
            echo "Attempt $attempt: $STATUS"

            if echo "$STATUS" | grep -Eqi 'complete|success'; then
              COMPLETE=1
              break
            fi

            if echo "$STATUS" | grep -Eqi 'error|failed|cancel'; then
              echo "Kaggle notebook failed."
              rm -rf /tmp/kaggle-failed-output
              mkdir -p /tmp/kaggle-failed-output
              kaggle kernels output "$KERNEL_REF" -p /tmp/kaggle-failed-output -o || true
              cat /tmp/kaggle-failed-output/*.log 2>/dev/null || true
              exit 1
            fi

            sleep 15
          done

          test "$COMPLETE" = "1"

      - name: Download and verify EDA outputs
        shell: bash
        run: |
          set -euo pipefail
          unset KAGGLE_API_TOKEN || true
          rm -rf /tmp/kaggle-eda-output
          mkdir -p /tmp/kaggle-eda-output

          kaggle kernels output "$KERNEL_REF" -p /tmp/kaggle-eda-output -o

          test -f /tmp/kaggle-eda-output/dataset_overview.json
          test -f /tmp/kaggle-eda-output/target_distribution.csv
          test -f /tmp/kaggle-eda-output/column_summary.csv

          echo "=== dataset_overview.json ==="
          cat /tmp/kaggle-eda-output/dataset_overview.json
          echo "=== target_distribution.csv ==="
          cat /tmp/kaggle-eda-output/target_distribution.csv
          echo "=== top 30 columns by missingness ==="
          head -n 31 /tmp/kaggle-eda-output/column_summary.csv

      - name: Preserve EDA summaries
        uses: actions/upload-artifact@v4
        with:
          name: brfss-2025-initial-eda
          path: |
            /tmp/kaggle-eda-output/dataset_overview.json
            /tmp/kaggle-eda-output/target_distribution.csv
            /tmp/kaggle-eda-output/column_summary.csv
          if-no-files-found: error
