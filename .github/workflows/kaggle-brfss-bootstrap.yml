name: Run BRFSS 2025 Full Study

on:
  push:
    branches:
      - main
    paths:
      - 02_Implementation/BRFSS_Survey/kaggle/dataset/dataset-metadata.json
      - 02_Implementation/BRFSS_Survey/kaggle/notebook/kernel-metadata.json
      - 02_Implementation/BRFSS_Survey/kaggle/notebook/BRFSS_2025_Diabetes_Classification.ipynb
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: brfss-kaggle-full-study
  cancel-in-progress: true

jobs:
  run-full-study:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
      DATASET_REF: phaninmnhthink16/brfss-2025-survey
      KERNEL_REF: phaninmnhthink16/brfss-2025-diabetes-classification
      ZIP_PATH: 02_Implementation/BRFSS_Survey/data/raw/LLCP2025XPT.zip
      DATASET_METADATA: 02_Implementation/BRFSS_Survey/kaggle/dataset/dataset-metadata.json
      NOTEBOOK_DIR: 02_Implementation/BRFSS_Survey/kaggle/notebook

    steps:
      - name: Checkout branch without downloading all LFS objects
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          lfs: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Detect executable study changes
        id: study_change
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          event = os.environ.get("GITHUB_EVENT_NAME", "")
          current = os.environ.get("GITHUB_SHA", "")
          before = "${{ github.event.before }}"
          nb_path = "02_Implementation/BRFSS_Survey/kaggle/notebook/BRFSS_2025_Diabetes_Classification.ipynb"
          force_paths = {
              "02_Implementation/BRFSS_Survey/kaggle/dataset/dataset-metadata.json",
              "02_Implementation/BRFSS_Survey/kaggle/notebook/kernel-metadata.json",
          }

          run_kaggle = event == "workflow_dispatch"
          reason = "manual dispatch" if run_kaggle else ""

          if not run_kaggle and before and before != "0" * 40:
              subprocess.run(["git", "fetch", "origin", before, "--depth=1"], check=False)
              changed = subprocess.check_output(
                  ["git", "diff", "--name-only", before, current],
                  text=True,
              ).splitlines()

              if force_paths.intersection(changed):
                  run_kaggle = True
                  reason = "dataset/kernel metadata changed"
              elif nb_path in changed:
                  def code_signature(raw):
                      nb = json.loads(raw)
                      return [
                          "".join(c.get("source", []))
                          for c in nb.get("cells", [])
                          if c.get("cell_type") == "code"
                      ]

                  old_raw = subprocess.check_output(
                      ["git", "show", f"{before}:{nb_path}"], text=True
                  )
                  new_raw = Path(nb_path).read_text(encoding="utf-8")
                  if code_signature(old_raw) != code_signature(new_raw):
                      run_kaggle = True
                      reason = "notebook executable code changed"
                  else:
                      reason = "notebook markdown/metadata only"

          print(f"run_kaggle={str(run_kaggle).lower()} ({reason})")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"run_kaggle={str(run_kaggle).lower()}\n")
              f.write(f"reason={reason}\n")
          PY

      - name: Install Kaggle CLI
        if: steps.study_change.outputs.run_kaggle == 'true'
        run: python -m pip install --upgrade pip kaggle

      - name: Validate canonical notebook syntax
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("02_Implementation/BRFSS_Survey/kaggle/notebook/BRFSS_2025_Diabetes_Classification.ipynb")
          nb = json.loads(path.read_text(encoding="utf-8"))

          cells = nb.get("cells", [])
          ids = [cell.get("id") for cell in cells]
          if any(not cell_id for cell_id in ids):
              raise SystemExit("Notebook contains cells without ids")
          if len(ids) != len(set(ids)):
              raise SystemExit("Notebook contains duplicate cell ids")

          code_cells = 0
          for idx, cell in enumerate(cells):
              if cell.get("cell_type") != "code":
                  continue
              code_cells += 1
              source = "".join(cell.get("source", []))
              compile(source, f"{path.name}:cell_{idx}", "exec")

          if code_cells < 40:
              raise SystemExit(f"Unexpectedly few code cells: {code_cells}")
          print(f"Notebook JSON and Python syntax OK: {code_cells} code cells")
          PY

      - name: Validate Kaggle access
        if: steps.study_change.outputs.run_kaggle == 'true'
        shell: bash
        run: |
          set -euo pipefail
          unset KAGGLE_API_TOKEN || true
          test -n "${KAGGLE_USERNAME:-}"
          test -n "${KAGGLE_KEY:-}"
          test "$KAGGLE_USERNAME" = "phaninmnhthink16"
          kaggle kernels list -m --page-size 1 >/dev/null
          echo "Authenticated with the expected verified Kaggle account."

      - name: Restore and verify frozen source data
        if: steps.study_change.outputs.run_kaggle == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git lfs pull --include="$ZIP_PATH" --exclude=""
          python - <<'PY'
          import hashlib
          import json
          import os
          import shutil
          import zipfile
          from pathlib import Path

          archive = Path(os.environ["ZIP_PATH"])
          expected_zip = "d26a8b391aa2966b58dc2a3ffddf8da050e9f38eb143d0f5ca7b3d21ece08f98"
          expected_xpt = "d99262f8854f018a600c3538ee78e4308569af700abe6b92b36180336c24dec2"
          def digest(path):
              with path.open("rb") as stream:
                  return hashlib.file_digest(stream, "sha256").hexdigest()

          assert archive.stat().st_size == 64642184, "Frozen ZIP size mismatch"
          assert digest(archive) == expected_zip, "Frozen ZIP checksum mismatch"
          upload = Path(os.environ["RUNNER_TEMP"]) / "brfss-kaggle-dataset"
          upload.mkdir(parents=True, exist_ok=True)
          xpt = upload / "LLCP2025.XPT"
          with zipfile.ZipFile(archive) as source:
              members = [m for m in source.infolist() if m.filename.strip() == xpt.name]
              assert len(members) == 1, "Expected exactly one frozen XPT member"
              with source.open(members[0]) as src, xpt.open("wb") as dst:
                  shutil.copyfileobj(src, dst)
          assert xpt.stat().st_size == 799971280, "Frozen XPT size mismatch"
          assert digest(xpt) == expected_xpt, "Frozen XPT checksum mismatch"
          metadata = Path(os.environ["DATASET_METADATA"])
          assert json.loads(metadata.read_text())["id"] == os.environ["DATASET_REF"]
          shutil.copyfile(metadata, upload / "dataset-metadata.json")
          print("Frozen ZIP and normalized XPT: size and SHA-256 verified.")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as stream:
              stream.write(f"DATASET_UPLOAD_DIR={upload}\n")
          PY

      - name: Create public dataset in verified account
        if: steps.study_change.outputs.run_kaggle == 'true'
        shell: bash
        run: |
          set -euo pipefail
          unset KAGGLE_API_TOKEN || true
          if kaggle datasets status "$DATASET_REF"; then
            echo "Dataset already exists; preserving its versions. Notebook verifies the input checksum."
          else
            kaggle datasets create -p "$DATASET_UPLOAD_DIR" --public --keep-tabular
          fi
          READY=0
          for attempt in $(seq 1 40); do
            if kaggle datasets files "$DATASET_REF" -v | grep -F "LLCP2025.XPT"; then
              READY=1
              break
            fi
            sleep 15
          done
          test "$READY" = "1"

      - name: Push canonical study notebook
        if: steps.study_change.outputs.run_kaggle == 'true'
        shell: bash
        run: |
          set -euo pipefail
          unset KAGGLE_API_TOKEN || true
          kaggle kernels push -p "$NOTEBOOK_DIR" --timeout 10800

      - name: Wait for canonical notebook
        if: steps.study_change.outputs.run_kaggle == 'true'
        shell: bash
        run: |
          set -euo pipefail
          unset KAGGLE_API_TOKEN || true
          COMPLETE=0
          for attempt in $(seq 1 720); do
            STATUS="$(kaggle kernels status "$KERNEL_REF" 2>&1 || true)"
            echo "Attempt $attempt: $STATUS"
            if echo "$STATUS" | grep -Eqi 'complete|success'; then
              COMPLETE=1
              break
            fi
            if echo "$STATUS" | grep -Eqi 'error|failed|cancel'; then
              rm -rf /tmp/brfss-failed
              mkdir -p /tmp/brfss-failed
              kaggle kernels output "$KERNEL_REF" -p /tmp/brfss-failed -o || true
              cat /tmp/brfss-failed/*.log 2>/dev/null || true
              exit 1
            fi
            sleep 15
          done
          test "$COMPLETE" = "1"

      - name: Read back and verify full-study outputs
        if: steps.study_change.outputs.run_kaggle == 'true'
        shell: bash
        run: |
          set -euo pipefail
          unset KAGGLE_API_TOKEN || true
          rm -rf /tmp/kaggle-study-output
          mkdir -p /tmp/kaggle-study-output
          kaggle kernels output "$KERNEL_REF" -p /tmp/kaggle-study-output -o

          test -f /tmp/kaggle-study-output/dataset_overview.json
          test -f /tmp/kaggle-study-output/preprocessing_summary.json

          for d in             model_01_logistic_regression             model_02_decision_tree             model_03_random_forest             model_04_gradient_boosting             model_05_xgboost             model_06_linear_svm             model_07_gaussian_naive_bayes
          do
            test -f "/tmp/kaggle-study-output/$d/cv_summary.csv"
            test -f "/tmp/kaggle-study-output/$d/test_summary.csv"
            test -f "/tmp/kaggle-study-output/$d/test_point_metrics.json"
          done

          OUT=/tmp/kaggle-study-output/model_comparison
          test -f "$OUT/model_comparison.csv"
          test -f "$OUT/paired_test_predictions.csv.gz"
          test -f "$OUT/paired_bootstrap_model_metrics.csv"
          test -f "$OUT/paired_bootstrap_differences.csv"
          test -f "$OUT/mcnemar_pairwise_holm.csv"
          test -f "$OUT/roc_comparison.png"
          test -f "$OUT/pr_comparison.png"
          test -f "$OUT/metric_matrix.png"
          test -f "$OUT/precision_recall_tradeoff.png"
          test -f "$OUT/calibration_comparison.png"
          test -f "$OUT/aggregated_feature_diagnostics.csv"
          test -f "$OUT/feature_diagnostic_matrix.png"
          test -f "$OUT/comparison_manifest.json"

          echo "=== SEVEN-MODEL COMPARISON ==="
          cat "$OUT/model_comparison.csv"
          echo "=== TOP PAIRED DISCRIMINATION COMPARISONS ==="
          python - <<'PY'
          import csv

          p = "/tmp/kaggle-study-output/model_comparison/paired_bootstrap_differences.csv"
          top = {"logistic_regression", "gradient_boosting", "xgboost", "linear_svm"}

          with open(p, newline="", encoding="utf-8") as f:
              rows = list(csv.DictReader(f))

          for row in rows:
              if (
                  row["model_a"] in top
                  and row["model_b"] in top
                  and row["metric"] in {"roc_auc", "pr_auc"}
              ):
                  print(
                      row["model_a"], "vs", row["model_b"], "|", row["metric"],
                      "| delta=", row["point_difference_a_minus_b"],
                      "| CI=[", row["ci95_lower"], ",", row["ci95_upper"], "]",
                  )
          PY

      - name: Preserve complete study outputs
        if: steps.study_change.outputs.run_kaggle == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: brfss-2025-full-study
          path: /tmp/kaggle-study-output/
          if-no-files-found: error

      - name: Skip notice for reporting-only edit
        if: steps.study_change.outputs.run_kaggle != 'true'
        run: echo "Kaggle execution skipped — ${{ steps.study_change.outputs.reason }}."
