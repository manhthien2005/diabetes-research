name: Run BRFSS 2025 Full Study

on:
  push:
    branches:
      - implement/BRFSS_survey
    paths:
      - 02_Implementation/BRFSS_Survey/kaggle/dataset/dataset-metadata.json
      - 02_Implementation/BRFSS_Survey/kaggle/notebook/kernel-metadata.json
      - 02_Implementation/BRFSS_Survey/kaggle/notebook/BRFSS_2025_Diabetes_Classification.ipynb
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: brfss-kaggle-full-study
  cancel-in-progress: true

jobs:
  run-full-study:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
      DATASET_REF: manhthien2005/brfss-2025-survey
      KERNEL_REF: manhthien2005/brfss-2025-diabetes-classification
      ZIP_PATH: 02_Implementation/BRFSS_Survey/data/raw/LLCP2025XPT.zip
      DATASET_METADATA: 02_Implementation/BRFSS_Survey/kaggle/dataset/dataset-metadata.json
      NOTEBOOK_DIR: 02_Implementation/BRFSS_Survey/kaggle/notebook

    steps:
      - name: Checkout branch without downloading all LFS objects
        uses: actions/checkout@v4
        with:
          ref: implement/BRFSS_survey
          fetch-depth: 1
          lfs: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Kaggle CLI
        run: python -m pip install --upgrade pip kaggle

      - name: Validate canonical notebook syntax
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("02_Implementation/BRFSS_Survey/kaggle/notebook/BRFSS_2025_Diabetes_Classification.ipynb")
          nb = json.loads(path.read_text(encoding="utf-8"))

          cells = nb.get("cells", [])
          ids = [cell.get("id") for cell in cells]
          if any(not cell_id for cell_id in ids):
              raise SystemExit("Notebook contains cells without ids")
          if len(ids) != len(set(ids)):
              raise SystemExit("Notebook contains duplicate cell ids")

          code_cells = 0
          for idx, cell in enumerate(cells):
              if cell.get("cell_type") != "code":
                  continue
              code_cells += 1
              source = "".join(cell.get("source", []))
              compile(source, f"{path.name}:cell_{idx}", "exec")

          if code_cells < 40:
              raise SystemExit(f"Unexpectedly few code cells: {code_cells}")
          print(f"Notebook JSON and Python syntax OK: {code_cells} code cells")
          PY

      - name: Validate Kaggle access
        shell: bash
        run: |
          set -euo pipefail
          unset KAGGLE_API_TOKEN || true
          test -n "${KAGGLE_USERNAME:-}"
          test -n "${KAGGLE_KEY:-}"
          kaggle kernels list -m --page-size 1 >/dev/null
          kaggle datasets status "$DATASET_REF"
          kaggle datasets files "$DATASET_REF" -v | grep -F "LLCP2025.XPT"

      - name: Push canonical study notebook
        shell: bash
        run: |
          set -euo pipefail
          unset KAGGLE_API_TOKEN || true
          kaggle kernels push -p "$NOTEBOOK_DIR" --timeout 10800

      - name: Wait for canonical notebook
        shell: bash
        run: |
          set -euo pipefail
          unset KAGGLE_API_TOKEN || true
          COMPLETE=0
          for attempt in $(seq 1 720); do
            STATUS="$(kaggle kernels status "$KERNEL_REF" 2>&1 || true)"
            echo "Attempt $attempt: $STATUS"
            if echo "$STATUS" | grep -Eqi 'complete|success'; then
              COMPLETE=1
              break
            fi
            if echo "$STATUS" | grep -Eqi 'error|failed|cancel'; then
              rm -rf /tmp/brfss-failed
              mkdir -p /tmp/brfss-failed
              kaggle kernels output "$KERNEL_REF" -p /tmp/brfss-failed -o || true
              cat /tmp/brfss-failed/*.log 2>/dev/null || true
              exit 1
            fi
            sleep 15
          done
          test "$COMPLETE" = "1"

      - name: Read back and verify full-study outputs
        shell: bash
        run: |
          set -euo pipefail
          unset KAGGLE_API_TOKEN || true
          rm -rf /tmp/kaggle-study-output
          mkdir -p /tmp/kaggle-study-output
          kaggle kernels output "$KERNEL_REF" -p /tmp/kaggle-study-output -o

          test -f /tmp/kaggle-study-output/dataset_overview.json
          test -f /tmp/kaggle-study-output/preprocessing_summary.json

          for d in             model_01_logistic_regression             model_02_decision_tree             model_03_random_forest             model_04_gradient_boosting             model_05_xgboost             model_06_linear_svm             model_07_gaussian_naive_bayes
          do
            test -f "/tmp/kaggle-study-output/$d/cv_summary.csv"
            test -f "/tmp/kaggle-study-output/$d/test_summary.csv"
            test -f "/tmp/kaggle-study-output/$d/test_point_metrics.json"
          done

          OUT=/tmp/kaggle-study-output/model_comparison
          test -f "$OUT/model_comparison.csv"
          test -f "$OUT/paired_test_predictions.csv.gz"
          test -f "$OUT/paired_bootstrap_model_metrics.csv"
          test -f "$OUT/paired_bootstrap_differences.csv"
          test -f "$OUT/mcnemar_pairwise_holm.csv"
          test -f "$OUT/roc_comparison.png"
          test -f "$OUT/pr_comparison.png"
          test -f "$OUT/metric_matrix.png"
          test -f "$OUT/precision_recall_tradeoff.png"
          test -f "$OUT/calibration_comparison.png"
          test -f "$OUT/aggregated_feature_diagnostics.csv"
          test -f "$OUT/feature_diagnostic_matrix.png"
          test -f "$OUT/comparison_manifest.json"

          echo "=== SEVEN-MODEL COMPARISON ==="
          cat "$OUT/model_comparison.csv"
          echo "=== TOP PAIRED DISCRIMINATION COMPARISONS ==="
          python - <<'PY'
          import csv

          p = "/tmp/kaggle-study-output/model_comparison/paired_bootstrap_differences.csv"
          top = {"logistic_regression", "gradient_boosting", "xgboost", "linear_svm"}

          with open(p, newline="", encoding="utf-8") as f:
              rows = list(csv.DictReader(f))

          for row in rows:
              if (
                  row["model_a"] in top
                  and row["model_b"] in top
                  and row["metric"] in {"roc_auc", "pr_auc"}
              ):
                  print(
                      row["model_a"], "vs", row["model_b"], "|", row["metric"],
                      "| delta=", row["point_difference_a_minus_b"],
                      "| CI=[", row["ci95_lower"], ",", row["ci95_upper"], "]",
                  )
          PY

      - name: Preserve complete study outputs
        uses: actions/upload-artifact@v4
        with:
          name: brfss-2025-full-study
          path: /tmp/kaggle-study-output/
          if-no-files-found: error
